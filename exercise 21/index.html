<body>
    <script>
        //filter exercise
        let numbers = [10,15,20,25,30]
        let even = numbers.filter(number => number % 2 === 0)
        console.log(even)
        //reduce  exercise
        let numb = [1,2,3,4,5]
        let result = numb.reduce((num,digit) => num * digit)
        console.log(result)
    </script>
</body>

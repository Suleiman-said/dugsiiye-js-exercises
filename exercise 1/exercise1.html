<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = 7
        let y = 3
        console.log( x + y)
        // output: 10
        console.log( x - y)
        //output: 4
        console.log(x * y)
        //output: 21
        console.log(x / y)
        //output: 2.333
        console.log(x % y)
        //output: 1
        console.log(x++)
        //output 8
        console.log(x--)
        //output 7
    </script>
</body>
</html>

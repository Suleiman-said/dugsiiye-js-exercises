<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color picker</title>
    <style>
        #colorPreview{
            width: 200px;
            height: 200px;
            margin: 20px 0;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #colorHistory{
            list-style: none;
            padding: 0;
        }
        #colorHistory li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Interactive color picker</h1>
    <label for="colorPicker">choose a color</label>
    <input type="color" name="colorPicker" id="colorPicker">
    <div id="colorPreview">Color Preview</div>
    <h2>color History</h2>
    <ul id="colorHistory"></ul>
    <button id="clearHistory">Clear History</button>
    <script src="./app.js"></script>
</body>
</html>
